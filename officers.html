<html>
<head>
<title>OFFICERS | ICT CLUB</title>
<style>
body{
    background-image: url("https://i.ibb.co/5gVS29b5/duplico.jpg");
    background-size: cover;
    background-attachment: fixed;
    font-family: Arial;
    color: white;
    text-align: center;
    margin: 0;
}
.header{
    background: linear-gradient(90deg, blue, purple);
    padding: 30px;
    animation: slideDown 1s; 
    
    /*CREATED BY MERCURIO */
}
@keyframes slideDown{
    from{transform: translateY(-100px);}
    to{transform: translateY(0);}
}
.nav a{
    text-decoration: none;
    color: white;
    background: #0038a8;
    padding: 12px 25px;
    margin: 8px;
    border-radius: 25px;
    display: inline-block;
    transition: 0.4s; 
    
    /* CREATED BY MERCURIO */
}
.nav a:hover{
    background: #ffcc00;
    color: black;
    transform: scale(1.1);
}


.officers{
    width: 90%;
    margin: 30px auto;
}
.card{
    background: rgba(0,0,0,0.7);
    width: 250px;
    display: inline-block;
    margin: 20px;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #0038a8;
    transition: 0.5s; 
}
.card:hover{
    transform: translateY(-15px) scale(1.05); 
    border-color: #ffcc00;
    box-shadow: 0 10px 30px #ffcc00;
}
.card img{
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #ffcc00;
}
h1{color: #ffcc00; font-size: 40px;}
h3{color: #ffcc00; margin: 10px 0 5px 0;}
</style>
</head>
<body>

<div class="header">
    <h1>CLUB OFFICERS</h1>
    <div class="nav">
        <a href="club.html">🏠 HOME</a>
        <a href="activities.html">📸 ACTIVITIES / GALLERY</a>
        <a href="officers.html">👥 OFFICERS</a>
    </div>
</div>

<div class="officers">
    <h2></h2>
    
    <div class="card">
        <img src="https://i.ibb.co/dsqNw4fD/1dece2c8357bdd7cee3b15036344faf5.jpg" alt="President">
        <h3></h3>
        <p>President</p>
    </div>

    <div class="card">
        <img src="https://i.ibb.co/dsqNw4fD/1dece2c8357bdd7cee3b15036344faf5.jpg" alt="Vice President">
        <h3></h3>
        <p>Vice President</p>
    </div>

    <div class="card">
        <img src="https://i.ibb.co/dsqNw4fD/1dece2c8357bdd7cee3b15036344faf5.jpg" alt="Secretary">
        <h3></h3>
        <p>Secretary</p>
    </div>

    <div class="card">
        <img src="https://i.ibb.co/dsqNw4fD/1dece2c8357bdd7cee3b15036344faf5.jpg" alt="Treasurer">
        <h3></h3>
        <p>Treasurer</p>
    </div>

</div>

</body>
</html>
